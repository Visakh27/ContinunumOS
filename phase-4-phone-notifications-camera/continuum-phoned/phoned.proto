// Continuum OS — Phone protocol (continuum-phoned <-> Companion)
// Notifications, messaging (via notification reply) and call state/control.
// Carried over continuumd's session; this daemon opens no sockets itself.
// STATUS: schema only.
syntax = "proto3";
package os.continuum.phone.v1;

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  PUBLIC = 1;
  PRIVATE = 2;   // phone hides content on a locked screen; desktop redacts unless the user opted in
  SECRET = 3;    // never mirrored; the Companion must not send these
}

message NotificationAction {
  uint32 index = 1;        // position on the phone; used to invoke it
  string label = 2;
  bool accepts_reply = 3;  // inline reply (RemoteInput)
}

message ChatMessage {
  string sender = 1;
  string text = 2;
  uint64 timestamp_unix_ms = 3;
}

message NotificationPosted {
  string key = 1;                    // phone-side key; stable across updates
  string app_package = 2;
  string app_name = 3;
  string title = 4;
  string body = 5;
  uint64 posted_at_unix_ms = 6;
  string category = 7;               // e.g. "msg", "call", "email"
  Visibility visibility = 8;
  bool ongoing = 9;
  string group_key = 10;
  repeated NotificationAction actions = 11;
  repeated ChatMessage messages = 12;  // set for messaging-style notifications
  bytes small_icon_png = 13;           // size-capped
}

message NotificationRemoved {
  string key = 1;
  RemovalReason reason = 2;
}

enum RemovalReason {
  REMOVAL_REASON_UNSPECIFIED = 0;
  DISMISSED_ON_PHONE = 1;
  DISMISSED_ON_DESKTOP = 2;   // echo acknowledging a DismissRequest
  APP_CANCELLED = 3;
  EXPIRED = 4;
}

// Desktop -> phone
message DismissRequest { string key = 1; }

message ActionInvoke {
  string key = 1;
  uint32 action_index = 2;
  string reply_text = 3;      // only when the action accepts a reply
}

message ActionResult {
  string key = 1;
  bool ok = 2;
  string error = 3;           // "notification_gone", "action_unavailable", "permission_revoked"
}

// Reconnect: desktop asks for the current set instead of replaying history.
message NotificationSyncRequest { uint64 since_unix_ms = 1; }
message NotificationSnapshot { repeated NotificationPosted active = 1; }

enum CallStateKind {
  CALL_STATE_UNSPECIFIED = 0;
  RINGING = 1;
  ACTIVE = 2;
  HELD = 3;
  ENDED = 4;
}

message CallState {
  string call_id = 1;
  CallStateKind state = 2;
  bool incoming = 3;
  string number = 4;
  string display_name = 5;    // contact name if the phone resolves it
}

enum CallCommand {
  CALL_COMMAND_UNSPECIFIED = 0;
  ANSWER = 1;
  REJECT = 2;
  HANG_UP = 3;
  DIAL = 4;
}

// Used only when Bluetooth HFP call control is unavailable (see ADR 0007).
message CallControl {
  string call_id = 1;         // empty for DIAL
  CallCommand command = 2;
  string number = 3;          // DIAL only
}
